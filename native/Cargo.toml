[workspace]
members = ["crates/dom", "crates/html", "crates/select", "crates/css", "crates/critters"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[package]
name = "critters-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
critters = { path = "crates/critters" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
